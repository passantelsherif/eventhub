<svg width="100%" viewBox="0 0 680 760" role="img" xmlns="http://www.w3.org/2000/svg">
<title>EventHub — Architecture Diagram</title>
<desc>Microservices architecture: React frontend, Auth (Node.js/PostgreSQL), Legacy Catalog (Java/MySQL), Booking (Python/MongoDB), Notification Worker (Go/RabbitMQ), AI Insight (Python/Ollama), Analytics (Python/Redis).</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .th { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
    .ts { font-size: 12px; font-weight: 400; fill: #555; }
    .box-gray   { fill: #f5f5f3; stroke: #9c9a92; }
    .box-purple { fill: #EEEDFE; stroke: #7F77DD; }
    .box-teal   { fill: #E1F5EE; stroke: #1D9E75; }
    .box-amber  { fill: #FAEEDA; stroke: #BA7517; }
    .box-coral  { fill: #FAECE7; stroke: #D85A30; }
    .box-blue   { fill: #E6F1FB; stroke: #378ADD; }
    .box-green  { fill: #EAF3DE; stroke: #639922; }
    .box-pink   { fill: #FBEAF0; stroke: #D4537E; }
    .th-gray   { fill: #2C2C2A; }
    .th-purple { fill: #3C3489; }
    .th-teal   { fill: #085041; }
    .th-amber  { fill: #633806; }
    .th-coral  { fill: #4A1B0C; }
    .th-blue   { fill: #0C447C; }
    .th-green  { fill: #27500A; }
    .th-pink   { fill: #4B1528; }
    .ts-gray   { fill: #5F5E5A; }
    .ts-purple { fill: #534AB7; }
    .ts-teal   { fill: #0F6E56; }
    .ts-amber  { fill: #854F0B; }
    .ts-coral  { fill: #993C1D; }
    .ts-blue   { fill: #185FA5; }
    .ts-green  { fill: #3B6D11; }
    .ts-pink   { fill: #993556; }
    .arr { stroke: #888780; stroke-width: 1; fill: none; }
    .arr-dash { stroke: #b4b2a9; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
  </style>
</defs>

<!-- Client -->
<rect x="250" y="20" width="180" height="44" rx="8" stroke-width="0.5" class="box-gray"/>
<text class="th th-gray" x="340" y="42" text-anchor="middle" dominant-baseline="central">Client (browser)</text>

<!-- Frontend -->
<rect x="240" y="100" width="200" height="52" rx="8" stroke-width="0.5" class="box-purple"/>
<text class="th th-purple" x="340" y="120" text-anchor="middle" dominant-baseline="central">Frontend</text>
<text class="ts ts-purple" x="340" y="140" text-anchor="middle" dominant-baseline="central">React • port 3000</text>

<!-- Client → Frontend -->
<line x1="340" y1="64" x2="340" y2="98" class="arr" marker-end="url(#arrow)" stroke="#888780"/>

<!-- Auth service -->
<rect x="40" y="220" width="190" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
<text class="th th-teal" x="135" y="240" text-anchor="middle" dominant-baseline="central">Auth service</text>
<text class="ts ts-teal" x="135" y="258" text-anchor="middle" dominant-baseline="central">Node.js / Express • 8082</text>

<!-- Legacy catalog -->
<rect x="250" y="220" width="190" height="52" rx="8" stroke-width="0.5" class="box-amber"/>
<text class="th th-amber" x="345" y="240" text-anchor="middle" dominant-baseline="central">Legacy catalog</text>
<text class="ts ts-amber" x="345" y="258" text-anchor="middle" dominant-baseline="central">Java / Spring Boot • 8081</text>

<!-- Booking service -->
<rect x="450" y="220" width="190" height="52" rx="8" stroke-width="0.5" class="box-coral"/>
<text class="th th-coral" x="545" y="240" text-anchor="middle" dominant-baseline="central">Booking service</text>
<text class="ts ts-coral" x="545" y="258" text-anchor="middle" dominant-baseline="central">Python / FastAPI • 8083</text>

<!-- Frontend → Services -->
<path d="M290 152 L135 218" class="arr" marker-end="url(#arrow)" stroke="#888780"/>
<line x1="340" y1="152" x2="345" y2="218" class="arr" marker-end="url(#arrow)" stroke="#888780"/>
<path d="M390 152 L545 218" class="arr" marker-end="url(#arrow)" stroke="#888780"/>

<!-- PostgreSQL -->
<rect x="40" y="340" width="152" height="44" rx="8" stroke-width="0.5" class="box-blue"/>
<text class="th th-blue" x="116" y="357" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
<text class="ts ts-blue" x="116" y="373" text-anchor="middle" dominant-baseline="central">Users / auth</text>

<!-- MySQL -->
<rect x="272" y="340" width="148" height="44" rx="8" stroke-width="0.5" class="box-blue"/>
<text class="th th-blue" x="346" y="357" text-anchor="middle" dominant-baseline="central">MySQL</text>
<text class="ts ts-blue" x="346" y="373" text-anchor="middle" dominant-baseline="central">Events catalog</text>

<!-- MongoDB -->
<rect x="490" y="340" width="148" height="44" rx="8" stroke-width="0.5" class="box-blue"/>
<text class="th th-blue" x="564" y="357" text-anchor="middle" dominant-baseline="central">MongoDB</text>
<text class="ts ts-blue" x="564" y="373" text-anchor="middle" dominant-baseline="central">Bookings / reviews</text>

<!-- Services → Databases -->
<line x1="135" y1="272" x2="116" y2="338" class="arr" marker-end="url(#arrow)" stroke="#888780"/>
<line x1="345" y1="272" x2="346" y2="338" class="arr" marker-end="url(#arrow)" stroke="#888780"/>
<line x1="545" y1="272" x2="564" y2="338" class="arr" marker-end="url(#arrow)" stroke="#888780"/>

<!-- Redis cache -->
<rect x="245" y="430" width="148" height="44" rx="8" stroke-width="0.5" class="box-green"/>
<text class="th th-green" x="319" y="447" text-anchor="middle" dominant-baseline="central">Redis cache</text>
<text class="ts ts-green" x="319" y="463" text-anchor="middle" dominant-baseline="central">Auth + analytics</text>

<!-- Auth → Redis -->
<line x1="135" y1="384" x2="244" y2="452" class="arr-dash" marker-end="url(#arrow)" stroke="#b4b2a9"/>
<!-- Booking → Redis -->
<line x1="545" y1="384" x2="394" y2="452" class="arr-dash" marker-end="url(#arrow)" stroke="#b4b2a9"/>

<!-- Message broker -->
<rect x="450" y="430" width="188" height="44" rx="8" stroke-width="0.5" class="box-gray"/>
<text class="th th-gray" x="544" y="447" text-anchor="middle" dominant-baseline="central">Message broker</text>
<text class="ts ts-gray" x="544" y="463" text-anchor="middle" dominant-baseline="central">RabbitMQ • bookings queue</text>

<!-- Booking → Broker (async) -->
<path d="M545 272 L545 310 L638 310 L638 452" class="arr-dash" marker-end="url(#arrow)" stroke="#b4b2a9"/>

<!-- Notification worker -->
<rect x="450" y="540" width="188" height="52" rx="8" stroke-width="0.5" class="box-green"/>
<text class="th th-green" x="544" y="560" text-anchor="middle" dominant-baseline="central">Notification worker</text>
<text class="ts ts-green" x="544" y="578" text-anchor="middle" dominant-baseline="central">Go • consumes queue</text>

<!-- Broker → Worker -->
<line x1="544" y1="474" x2="544" y2="538" class="arr" marker-end="url(#arrow)" stroke="#888780"/>

<!-- AI insight service -->
<rect x="40" y="430" width="188" height="52" rx="8" stroke-width="0.5" class="box-pink"/>
<text class="th th-pink" x="134" y="450" text-anchor="middle" dominant-baseline="central">AI insight service</text>
<text class="ts ts-pink" x="134" y="468" text-anchor="middle" dominant-baseline="central">Python / FastAPI • 8084</text>

<!-- Booking → AI (sync, review submission) -->
<path d="M450 248 L230 248 L134 428" class="arr" marker-end="url(#arrow)" stroke="#888780"/>

<!-- Ollama -->
<rect x="40" y="540" width="188" height="44" rx="8" stroke-width="0.5" class="box-gray"/>
<text class="th th-gray" x="134" y="557" text-anchor="middle" dominant-baseline="central">Ollama (local LLM)</text>
<text class="ts ts-gray" x="134" y="573" text-anchor="middle" dominant-baseline="central">Sentiment + summary</text>

<!-- AI → Ollama -->
<line x1="134" y1="482" x2="134" y2="538" class="arr" marker-end="url(#arrow)" stroke="#888780"/>

<!-- Analytics service -->
<rect x="245" y="540" width="188" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
<text class="th th-teal" x="339" y="560" text-anchor="middle" dominant-baseline="central">Analytics service</text>
<text class="ts ts-teal" x="339" y="578" text-anchor="middle" dominant-baseline="central">Python / FastAPI • 8085</text>

<!-- Redis → Analytics (background job reads) -->
<line x1="319" y1="474" x2="339" y2="538" class="arr" marker-end="url(#arrow)" stroke="#888780"/>

<!-- Frontend → Analytics (dashboard, dashed) -->
<path d="M390 152 L630 152 L630 660 L434 660 L339 594" class="arr-dash" marker-end="url(#arrow)" stroke="#b4b2a9"/>

<!-- Legend -->
<line x1="40" y1="700" x2="70" y2="700" class="arr" marker-end="url(#arrow)" stroke="#888780"/>
<text class="ts" x="76" y="700" dominant-baseline="central" fill="#555">Synchronous HTTP</text>
<line x1="210" y1="700" x2="240" y2="700" class="arr-dash" marker-end="url(#arrow)" stroke="#b4b2a9"/>
<text class="ts" x="246" y="700" dominant-baseline="central" fill="#555">Async / cache read</text>

</svg>
