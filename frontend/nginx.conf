server {
    # 8080: OpenShift restricted SCC cannot bind privileged port 80.
    # Local compose / run-all.sh map host 3000 -> container 8080.
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The container DNS server differs per orchestrator: Docker's embedded
    # resolver is 127.0.0.11, Podman's is the network gateway, OpenShift's
    # is CoreDNS (often 172.30.0.10). Injected at startup via envsubst.
    # ipv6=off avoids nginx trying AAAA first and failing inside the cluster.
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;

    location /api/catalog {
        set $upstream http://legacy-catalog:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    location /api/auth {
        set $upstream http://auth-service:8082;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    location /api/bookings {
        set $upstream http://booking-service:8083;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    location /api/analytics {
        set $upstream http://analytics-api:8085;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    location /api/analyze {
        set $upstream http://ai-insight:8084;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
